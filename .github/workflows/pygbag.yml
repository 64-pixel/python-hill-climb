
name: Build and deploy Hill Climb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean previous build
        run: rm -rf hill-climb-python/build

      - name: Install Pygbag
        run: pip install pygbag==0.9.3

      - name: Build game
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8
        run: python -m pygbag --build ./hill-climb-python

      - name: Remove obsolete BrowserFS reference
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hill-climb-python/build/web/index.html")
          html = path.read_text(encoding="utf-8")
          lines = [
              line for line in html.splitlines()
              if "browserfs.min.js" not in line
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("BrowserFS reference removed.")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: hill-climb-python/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
